[project]
name = "self-service-platform"
version = "0.1.0"
description = "Local control plane for self-service tenant provisioning: validate a manifest, estimate cost, and create, update, or destroy the tenant, with opt-in Bedrock and CloudWatch adapters."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
ssp = "self_service_platform.app:app"
ssp-mcp = "self_service_platform.mcp_main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,logs]>=1.35",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
